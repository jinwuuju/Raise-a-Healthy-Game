name: Build and deploy game + design site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Use pinned npm
        run: npm install -g npm@12.2.0
      - name: Install dependencies
        run: npm ci
      - name: Validate planning sources
        run: python3 tools/check_design.py
      - name: Build design site
        run: python3 tools/build_site.py
      - name: Validate design site
        run: python3 tools/check_site.py
      - name: Unit tests
        run: npm test
      - name: Build game
        run: npm run build
      - name: Assemble Pages (game at /, design site at /design/)
        run: |
          mkdir -p dist/design
          cp -R _site/. dist/design/
          touch dist/.nojekyll
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
